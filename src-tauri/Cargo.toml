[package]
name = "video-plucker"
version = "4.5.1"
description = "Video Plucker — download videos from YouTube, X, TikTok, and streaming sites"
authors = ["Prince Shammah"]
edition = "2021"

[lib]
name = "yt_plucker_lib"
# Desktop-only: rlib is all the bin needs. The staticlib/cdylib crate-types
# (for mobile) build a DLL that auto-exports every symbol and blows past PE's
# 65535-export limit under the GNU/LLD linker.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streaming-site extractors: HTTP client for the site APIs. rustls-tls avoids an
# OpenSSL build dep so the Windows/GNU + NSIS pipeline stays self-contained.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"
scraper = "0.20"
# AllAnime now AES-256-CTR-encrypts some episode-source responses ("tobeparsed").
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
